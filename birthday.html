<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#cfeeff">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="stars"><span style="left:8%;top:15%">✦</span><span
            style="left:88%;top:18%;animation-delay:1s">✧</span><span
            style="left:15%;top:78%;animation-delay:1.8s">✦</span><span
            style="left:90%;top:76%;animation-delay:.5s">⋆</span></div>
   
    <main class="page">
        <div class="wrap">
            <div class="card birthday"><span class="pill">Today is your day</span>
                <h1>Happy Birthday! 🎂</h1>
                <div class="name data-name">Sylvia</div>
                <p class="message">Today is all about celebrating you and all the happiness you bring to the people
                    around you.</p>
                <div class="characters">
                    <div class="character puppy">
                            <img src="Syls4.jpg" alt="Her photo">
                    </div>
                    <div class="character penguin">
                            <img src="Smiling Cartoon Avatar with Earbuds.jpg" alt="Her photo">
                    </div>
                    <div class="heart">🤝</div>
                </div>
                <div class="balloons">🎈 💕 ✨ 🎈</div>
                <div class="card" style="box-shadow:none;background:#ffffffa8;margin-top:20px"><strong
                        style="font-size:1.15rem">A little gift...</strong>
                    <div class="gift" id="gift" tabindex="0" role="button" aria-label="Open birthday gift">
                        <div class="lid"></div>
                        <div class="bow"></div>
                        <div class="giftbox"></div>
                    </div>
                    <div id="giftMessage" class="hidden-msg"></div><small style="color:#929aaa">Tap the gift to open
                        it</small>
                </div>
                <div class="actions"><a class="btn" href="memories.html">Continue to the memories →</a></div>
            </div>
        </div>
    </main>
    <div id="confetti" class="confetti"></div>
    <script src="script.js"></script>
    <script>document.getElementById('giftMessage').textContent = CONFIG.giftMessage;</script>
</body>

</html>
